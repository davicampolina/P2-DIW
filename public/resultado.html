<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Fazenda - Resultado</title>
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="img/logo-fazenda.jpg" alt="logo"> Votação 2026
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="votacao.html">Votar</a></li>
          <li class="nav-item"><a class="nav-link active" href="resultado.html">Resultado</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="titulo">Parcial da eliminação</h1>
    <p>Total: <span id="total" class="numero">0</span> votos</p>

    <div id="placar"></div>

    <div id="sem-votos" class="alert alert-warning d-none">
      Ainda não tem nenhum voto. <a href="votacao.html" class="alert-link">Clique aqui para votar!</a>
    </div>

    <button id="btn-zerar" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#modalZerar">Zerar votação</button>
  </div>

  <div class="modal fade" id="modalZerar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content text-dark">
        <div class="modal-header">
          <h5 class="modal-title">Zerar votação</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Tem certeza que quer apagar todos os votos?
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="confirmar" class="btn btn-danger" data-bs-dismiss="modal">Sim, zerar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-3">AV2 - DIW - PUC Minas</footer>

  <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/resultado.js"></script>
</body>
</html>
